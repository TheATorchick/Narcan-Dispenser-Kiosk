<!doctype html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Home | Narcan Dispenser Kiosk</title>
	<link href="CSS/main.css" rel="stylesheet" type="text/css">
	<link rel="stylesheet" href="https://use.typekit.net/lzn5wlh.css">
	<script src="scripts/scripts.js" defer></script>
</head>

<body>
	<main class="homePage">
		<div class="title homePageTitle">
			<div class="home">
				<!--
				<button class="bubble" id="home-Button">
					<h2>Home</h2>
				</button>
			-->
			</div>
			<img class="siteLogo" src="images/Logo.svg" alt="Narcan Dispenser Kiosk">
			<div class="dispense">
				<!--
				<button class="bubble" id="dispense-Button">
					<h2>Dispense</h2>
				</button>
			-->
			</div>
		</div>
		<div class="body">
			<div class="dispenseButton">
				<button id="dispense-Button" class="bubble">
					<h1>Dispense</h1>
				</button>
			</div>
			<div class="otherButtons">
				<a id="learnMore" class="bubble" href="learnMore.html">
					<h2>Learn More</h2>
				</a>
				<a id="contact" class="bubble" href="contact.html">
					<h2>Get in Contact</h2>
				</a>
			</div>
		</div>
	</main>
	<dialog class="itemSheetDialog contactSheetDialog" id="homeContactDialog" aria-label="Contact form">
		<div class="bubble contactPanel itemSheetBubble">
			<div class="contactSheetHeader">
				<button class="itemBack itemSheetClose" id="closeHomeContact" type="button" aria-label="Close contact form">
					<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
						<line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
						<line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
					</svg>
				</button>
				<h3>Get in Touch</h3>
			</div>
			<p>Use this form to get in touch and learn more about the Narcan Dispenser Kiosk.</p>
			<hr class="contactDivider">
			<form class="contactForm" id="homeContactForm">
				<div class="contactFields">
					<div>
						<label for="homeContactName">Name:</label>
						<input type="text" id="homeContactName" name="name" placeholder="Enter your name">
					</div>
					<div>
						<label for="homeContactEmail">Email:</label>
						<input type="email" id="homeContactEmail" name="email" placeholder="Enter your email">
					</div>
				</div>
				<div class="messageField">
					<label for="homeContactMessage">Message:</label>
					<textarea id="homeContactMessage" name="message" rows="8" placeholder="Write your message"></textarea>
				</div>
				<button class="bubble contactSubmit" type="submit">Submit</button>
			</form>
		</div>
	</dialog>
	<footer class="entryFooter">
		<button class="footerReveal" id="footerReveal" type="button" aria-label="Show footer links" aria-expanded="false" aria-controls="footerLinks"></button>
		<nav class="footerLinks" id="footerLinks" aria-label="Footer navigation" hidden>
			<a href="admin.html">Admin</a>
			<a href="about.html">About</a>
		</nav>
	</footer>
</body>

</html>
