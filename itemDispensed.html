<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Dispensing Confirmation</title>
    <link href="CSS/main.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://use.typekit.net/lzn5wlh.css">
    <script src="scripts/scripts.js" defer></script>
</head>

<body>
    <main>
        <div class="title">
            <div class="home" aria-hidden="true"></div>
            <img class="siteLogo" src="images/Logo.svg" alt="Narcan Dispenser Kiosk">
            <div class="dispense" aria-hidden="true"></div>
        </div>
        <div class="bubble pageName dispensingPanel">
            <h2>Dispensing <span data-dispensed-item></span></h2>
            <div class="dispensingSpinner" role="status" aria-label="Dispensing"></div>
            <p>Please wait while your <span data-dispensed-item></span> is dispensed.</p>
            <a class="bubble dispensingCancel" href="dispense.html">Cancel</a>
        </div>
    </main>

    <script>
        const dispenseParams = new URLSearchParams(window.location.search);

        async function getDispensedItem() {
            const directItem = dispenseParams.get("item");
            if (directItem) {
                return directItem;
            }

            const sourceItem = dispenseParams.get("source");
            if (!sourceItem) {
                return "selected product";
            }

            try {
                const response = await fetch("itemInformation.json");
                if (!response.ok) {
                    throw new Error("Could not load information.");
                }
                const items = await response.json();
                const dispenses = items[sourceItem]?.dispenses;
                const index = Number.parseInt(dispenseParams.get("index") || "0", 10);
                return Array.isArray(dispenses) ? dispenses[index] || sourceItem : sourceItem;
            } catch {
                return sourceItem;
            }
        }

        let dispensingTimer;
        let confirmationTimer;
        const dispensingPanel = document.querySelector(".dispensingPanel");
        document.querySelector(".dispensingCancel").addEventListener("click", (event) => {
            event.preventDefault();
            window.clearTimeout(dispensingTimer);
            window.clearTimeout(confirmationTimer);
            dispensingPanel.classList.add("is-canceling");
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    window.setTimeout(() => {
                        window.location.href = "dispense.html";
                    }, 250);
                });
            });
        });

        getDispensedItem().then((item) => {
            document.querySelectorAll("[data-dispensed-item]").forEach((element) => {
                element.textContent = item;
            });
            document.title = `${item} Dispensed`;

            dispensingTimer = window.setTimeout(() => {
                document.querySelector(".dispensingSpinner")?.remove();
                confirmationTimer = window.setTimeout(() => {
                    alert(`${item} has been dispensed. Thank you for using the kiosk`);
                    window.location.href = "home.html";
                }, 150);
            }, 4000);
        });
    </script>
</body>

</html>
